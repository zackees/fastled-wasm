# Guest-side helper for macos-x64-guest-webkit-probe.yml: opens a URL through
# LaunchServices, which is what `/usr/bin/open` does. macOS Recovery ships no
# `open`, and Safari treats a command-line argument as a sandboxed file path.
# Deliberately not a workspace member, and dependency-free.
[package]
name = "open-url"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]
