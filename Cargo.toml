[workspace]
resolver = "2"
members = [
    "crates/fastled-cli",
]

[workspace.package]
version = "2.0.20"
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/zackees/fastled-wasm"
homepage = "https://github.com/zackees/fastled-wasm"

[workspace.dependencies]
kernal-api = { git = "https://github.com/zackees/kernal-api.git", tag = "v0.1.4", features = ["fs", "fs-watch", "hash-sha256", "archive", "http-client", "http-server", "websocket", "event-stream", "secure-random", "text-similarity", "pty", "terminal-input", "terminal-style", "command-arguments", "command-schema", "config-toml", "source-cpp", "json", "error-context"] }

[profile.release]
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "none"

[profile.dev.package.kernal-api]
codegen-units = 1

[profile.test.package.kernal-api]
codegen-units = 1
