[workspace]
resolver = "2"
members = [
    "crates/fastled-cli",
]

[workspace.package]
version = "2.0.20"
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/zackees/fastled-wasm"
homepage = "https://github.com/zackees/fastled-wasm"

[workspace.dependencies]
kernal-api = { version = "=0.1.0", features = ["fs", "fs-watch", "hash-sha256", "archive", "http-client", "http-server", "event-stream", "secure-random", "text-similarity", "terminal-input", "terminal-style", "command-arguments", "command-schema", "config-toml", "source-cpp", "json"] }
anyhow = "1"

[profile.release]
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "none"

# Temporary migration override; replace with the verified published release.
[patch.crates-io]
kernal-api = { path = "../fastled-wasm-extern/kernal-api-cli" }

[profile.dev.package.kernal-api]
codegen-units = 1

[profile.test.package.kernal-api]
codegen-units = 1
