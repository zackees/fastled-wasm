[workspace]
resolver = "2"
members = [
    "crates/fastled-cli",
]

[workspace.package]
version = "2.0.20"
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/zackees/fastled-wasm"
homepage = "https://github.com/zackees/fastled-wasm"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
kernal-api = { version = "=0.1.0", features = ["fs", "fs-watch", "hash-sha256"] }
reqwest = { version = "0.12", features = ["blocking"] }
zip = "2"
tar = "0.4"
zstd = "0.13"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ctcb-core = "0.4.1"
strsim = "0.11"
crossterm = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors", "set-header"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"
tauri = { version = "2", features = ["devtools"] }
tauri-build = { version = "2", features = [] }
shell-words = "1"
tree-sitter = "0.26.9"
tree-sitter-cpp = "0.23.4"

[profile.release]
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "none"

# Temporary migration override; replace with the verified published release.
[patch.crates-io]
kernal-api = { path = "../fastled-wasm-extern/kernal-api" }

[profile.dev.package.kernal-api]
codegen-units = 1

[profile.test.package.kernal-api]
codegen-units = 1
