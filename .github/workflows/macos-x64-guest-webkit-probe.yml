name: macOS x64 Guest WebKit Probe

# Can a docker-mac-x64 guest on a Linux runner replace the hosted macOS runner
# for the live viewer render and the Safari smoke (#251)? This probe measures
# it, and the answer so far is no:
#
# The guest boots zackees/docker-mac-x64's macOS 13 Recovery system under
# QEMU/KVM with a plain VGA adapter. That guest has no Metal-capable GPU, and
# macOS WebKit implements WebGL only on Metal, so the shipped viewer's WKWebView
# reports neither WebGL2 nor WebGL1 (and Safari 16.1's WebKit has no
# OffscreenCanvas). The FastLED frontend requires WebGL2 (bootstrap.ts), so a
# sketch cannot render there. A newer macOS image would not change that: the
# guest would still have no GPU with a macOS Metal driver. Recovery also
# lacks python3, `open`, `screencapture` and `safaridriver`, so Safari is
# opened through LaunchServices by ci/macos-x64/open-url.
#
# macos-arm-live-test.yml therefore keeps the hosted runner for rendering and
# Safari. This workflow stays as the way to re-measure when the guest image or
# the GPU situation changes: it runs on demand, and on pull requests that touch
# the probe itself. The job summary reports what each WebKit client saw.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/macos-x64-guest-webkit-probe.yml
      - ci/macos-x64/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Same pin as macos-arm-live-test.yml: a Soldr with cross targets and the
      # managed macOS SDK.
      - uses: zackees/setup-soldr@bb28e96d2dc32c058242f56722297caf1efcbd90
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          cache-key-suffix: macos-x64-guest-cross
          cross-targets: x86_64-apple-darwin
          toolchain-file: rust-toolchain.toml
          prebuild-deps-flags: ""

      - name: Cross-build the Intel fastled binary
        run: |
          soldr cargo build --release --bin fastled --target x86_64-apple-darwin
          # Must be an x86_64 Mach-O, not a host binary.
          test "$(od -A n -t x1 -N 8 target/x86_64-apple-darwin/release/fastled | tr -d ' \n')" = "cffaedfe07000001"

      - name: Cross-build the guest URL opener
        run: |
          soldr cargo build --release --locked --manifest-path ci/macos-x64/open-url/Cargo.toml --target x86_64-apple-darwin --target-dir target/open-url
          test "$(od -A n -t x1 -N 8 target/open-url/x86_64-apple-darwin/release/open-url | tr -d ' \n')" = "cffaedfe07000001"

      - name: Stage the guest share directory
        run: |
          mkdir -p share
          cp ci/macos-x64/webgl.html target/x86_64-apple-darwin/release/fastled target/open-url/x86_64-apple-darwin/release/open-url share/

      # Recovery boots one script and offers no per-command execution, so the
      # guest half travels as a single string.
      - name: Generate the guest script
        id: guest_script
        run: |
          {
            echo 'script<<GUEST_EOF'
            cat ci/macos-x64/probe-guest.sh
            echo 'GUEST_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Probe WebKit in a macOS Recovery guest
        id: macos
        uses: zackees/docker-mac-x64@f173a047ba7fbe1db7d8162ff3ac8e276f50b153 # main
        with:
          share-dir: share
          collect: /tmp/results
          ram: "10"
          cores: "2"
          threads: "4"
          boot-timeout: "1200"
          run-timeout: "1200"
          run: ${{ steps.guest_script.outputs.script }}

      # The guest never exits non-zero, so the reports are the gate: each
      # WebKit client must have answered, or the probe measured nothing.
      - name: Summarize what each WebKit client reported
        if: ${{ !cancelled() }}
        env:
          COLLECTED: ${{ steps.macos.outputs.workdir }}/collected
          STARTED: ${{ steps.guest_script.outputs.started }}
        run: |
          set -euo pipefail
          log="$COLLECTED/server.log"
          test -f "$log" || { echo "::error::the guest returned no server log"; exit 1; }
          {
            echo "## macOS x64 guest WebKit probe"
            echo
            echo "Guest boot plus probe: $(( $(date +%s) - STARTED )) s"
            echo
            echo '```'
            cat "$COLLECTED/guest.txt"
            echo '```'
            echo
            echo "| client | report |"
            echo "|---|---|"
            sed -n 's/^\[viewer\] \([a-z]*\) \(.*\)$/| \1 | \2 |/p' "$log"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          grep -q "^\[viewer\] viewer WEBGL2 " "$log" \
            || { echo "::error::the shipped viewer never reported; the probe measured nothing"; exit 1; }
          grep -q "^\[viewer\] safari-[a-z]* WEBGL2 " "$log" \
            || echo "::warning::Safari loaded no page by any launch method; see the uploaded logs and final.ppm"

      - name: Upload the guest results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-guest-webkit-probe
          path: |
            ${{ steps.macos.outputs.workdir }}/results/
            ${{ steps.macos.outputs.workdir }}/collected/
          if-no-files-found: warn
          retention-days: 7
