[package]
name = "fastled-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "FastLED WASM compilation CLI"

[features]
default = ["viewer"]
viewer = ["dep:tauri", "dep:tauri-build", "dep:gtk", "dep:webkit2gtk"]

[lib]
name = "fastled_cli"
path = "src/lib.rs"

[[bin]]
name = "fastled"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
kernal-api = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
ctcb-core = { workspace = true }
strsim = { workspace = true }
crossterm = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true, features = ["ws"] }
portable-pty = "=0.9.0"
tower-http = { workspace = true }
tokio-stream = { workspace = true }
toml = { workspace = true }
tauri = { workspace = true, optional = true }
tempfile = "3"
shell-words = { workspace = true }
getrandom = "0.3"
tree-sitter = { workspace = true }
tree-sitter-cpp = { workspace = true }

[build-dependencies]
indexmap = { version = "1.9.3", features = ["std"] }
tauri-build = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Same gtk 0.18 that tauri/tao link; used to correct GTK's font DPI before the webview exists.
gtk = { version = "0.18", optional = true }
# Same webkit2gtk that wry links; used to grant microphone access to the page.
webkit2gtk = { version = "2.0", features = ["v2_40"], optional = true }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/fastled-{ target }{ archive-suffix }"
bin-dir = "fastled{ binary-ext }"
pkg-fmt = "zip"

[dev-dependencies]
reqwest = { workspace = true }
