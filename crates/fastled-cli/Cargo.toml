[package]
name = "fastled-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "FastLED WASM compilation CLI"

[features]
default = ["viewer"]
# Gates only this crate's viewer code. Tauri itself is enabled on the
# kernal-api dependency below: a `kernal-api/tauri-webview` entry here would
# also apply to the same-named build-dependency and compile Tauri, GTK and
# glib for the host build script.
viewer = []

[lib]
name = "fastled_cli"
path = "src/lib.rs"

[[bin]]
name = "fastled"
path = "src/main.rs"

[dependencies]
kernal-api = { workspace = true, features = ["tauri-webview"] }

# build.rs embeds the Windows icon, version information and manifest through
# kernal-api's `build-resources` feature. Only that feature: every runtime
# feature stays on the normal dependency, so the build script compiles
# kernal-api's native base plus the resource compiler and nothing else.
[build-dependencies]
kernal-api = { version = "=0.1.19", default-features = false, features = ["build-resources"] }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/fastled-{ target }{ archive-suffix }"
bin-dir = "fastled{ binary-ext }"
pkg-fmt = "zip"
